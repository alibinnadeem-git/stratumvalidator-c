name: STRATUM Validator PoVI CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: TypeScript integrity
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: PoVI source invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('lib/server/povi.ts','utf8');
          for(const required of [
            "Math.floor((2*activeValidatorCount)/3)+1",
            "STRATUM/POVI/VERIFY/1",
            "STRATUM/POVI/COMMIT/1",
            "sv_povi_messages",
            "Equivocation protection",
            "poviConformant:false"
          ]) if(!p.includes(required)) throw new Error(`Missing PoVI invariant: ${required}`);
          const legacyPath='app/stratum/verified/v1/records/route.ts';
          if(fs.existsSync(legacyPath)){
            const legacy=fs.readFileSync(legacyPath,'utf8');
            if(!legacy.includes('anchorServerless')) throw new Error('Legacy public anchor was changed before coordinated activation');
          } else console.log('Peer-only validator: no public legacy anchor route to protect');
          console.log('PoVI staged-source invariants passed');
          NODE
      - name: Validator registry source invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=fs.readFileSync('lib/server/validator-registry.ts','utf8');
          for(const required of [
            "'CANDIDATE','ACTIVE','DEGRADED','QUARANTINED','RETIRED','REVOKED'",
            "'CONSENSUS','VRF','TRANSPORT'",
            "authority:'PLAN_ONLY'",
            "authoritativeForConsensus:false",
            "activationPolicy:'GOVERNED_FUTURE_HEIGHT'",
            "quorumOfflinePolicy:'QUORUM_IS_NOT_LOWERED_FOR_OFFLINE_VALIDATORS'",
            "enrollment_code_hash",
            "UNIQUE(chain_id,friendly_label)",
            "UNIQUE(chain_id,identity_uuid)"
          ]) if(!r.includes(required)) throw new Error(`Missing validator-registry invariant: ${required}`);
          if(r.includes('PRIVATE_KEY')) throw new Error('Validator registry must never handle private keys');
          const route=fs.readFileSync('app/v1/validators/route.ts','utf8');
          if(/export\s+async\s+function\s+POST/.test(route)) throw new Error('Public validator registry route must remain read-only');
          console.log('Redbook validator registry staged-source invariants passed');
          NODE
